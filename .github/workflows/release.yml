name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    # Runs before anything publishes: the tag, package.json and server.json must
    # name the same version, or postinstall.js and the MCP registry would point
    # at a release that does not match.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          # server.json carries the version twice: its own, and packages[0].version,
          # the npm version the MCP registry installs.
          for field in "package.json:.version" "server.json:.version" "server.json:.packages[0].version"; do
            f="${field%%:*}"
            got=$(node -p "require('./$f')${field#*:}")
            if [ "$got" != "$v" ]; then
              echo "::error file=$f::${field#*:} is $got, the tag says $v"
              exit 1
            fi
          done
          # packages[1] is the Docker image; its tag must be this release's.
          got=$(node -p "require('./server.json').packages[1].identifier")
          case "$got" in
            *":v$v") ;;
            *) echo "::error file=server.json::.packages[1].identifier is $got, the tag says v$v"; exit 1 ;;
          esac

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    # The release itself is created with GH_RELEASE_TOKEN; Docker Hub and Apple
    # use their own secrets. Nothing here needs more than contents: write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser builds the release notes from the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from a clean module cache, never one a pull request could have written.
          cache: false
      # .goreleaser.yaml skips signing when the secrets are absent, which is
      # right for snapshots and wrong for a release: stop here instead.
      - name: Require the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=0
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Pinned: a new goreleaser release must not change the build unseen.
          version: v2.19.0
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # The npm package ships this file, and postinstall.js checks the
      # downloaded binary against it, so the checksum comes from the package
      # npm verified rather than from the mutable GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - name: checksums.txt covers every npm platform
        run: |
          v="${GITHUB_REF_NAME#v}"
          for a in darwin_amd64.tar.gz darwin_arm64.tar.gz linux_amd64.tar.gz linux_arm64.tar.gz windows_amd64.zip windows_arm64.zip; do
            grep -qE "^[0-9a-f]{64}  genieacs-mcp_${v}_${a}$" checksums.txt || { echo "::error::checksums.txt has no genieacs-mcp_${v}_${a}"; exit 1; }
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+; Node 24 ships both, so no ad-hoc npm install.
          node-version: '24'
          # A stale runner cache could hold an early 24.x with npm below 11.5.1.
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: The package carries checksums.txt
        run: npm pack --dry-run --json | jq -e '.[0].files | map(.path) | index("checksums.txt")'
      - run: npm publish --loglevel verbose

  mcp-registry:
    needs: npm-publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
